<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Central Graphic: Production Garment & Analytics Indicator -->
  <g filter="url(#glow)">
    <!-- Dashboard metric card base / clipboard -->
    <rect x="110" y="100" width="292" height="320" rx="32" fill="#ffffff" fill-opacity="0.08" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
    
    <!-- Top hanger / clip -->
    <path d="M 216 100 C 216 75, 296 75, 296 100" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    
    <!-- Garment T-shirt / apparel silhouette inside -->
    <path d="M 190 170 
             L 160 215 
             L 190 235 
             L 210 215 
             L 210 320 
             L 302 320 
             L 302 215 
             L 322 235 
             L 352 215 
             L 322 170 
             C 300 190, 212 190, 190 170 Z" 
          fill="url(#accentGrad)" />

    <!-- Upward Trend / Production Bar chart -->
    <rect x="160" y="345" width="36" height="35" rx="8" fill="#38bdf8" opacity="0.9" />
    <rect x="208" y="325" width="36" height="55" rx="8" fill="#60a5fa" opacity="0.9" />
    <rect x="256" y="300" width="36" height="80" rx="8" fill="#818cf8" opacity="0.9" />
    <rect x="304" y="270" width="36" height="110" rx="8" fill="#34d399" opacity="0.95" />

    <!-- Checkmark badge (100% completed order status) -->
    <circle cx="340" cy="240" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4" />
    <path d="M 328 240 L 336 248 L 354 230" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>